version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - godot
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming

formatters:
  enable:
    - gofmt
    - goimports
