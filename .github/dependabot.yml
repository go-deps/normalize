version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directories:
      - /
      - /normtext
    ignore:
      # normtext moves to a new core version in its own release commit.
      - dependency-name: github.com/go-deps/normalize
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
